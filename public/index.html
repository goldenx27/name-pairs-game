<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6d5dfc" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="החבורה שלי" />
  <title>החבורה שלי</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/app-icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/app-icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/v02.css" />
  <link rel="stylesheet" href="/progress.css" />
</head>
<body>
  <main class="app">
    <header><h1>✨ החבורה שלי</h1><div class="headerActions"><button id="installAppBtn" class="ghost hidden">📲 התקן</button><button id="modeBtn" class="ghost">🔒 אזור הורה</button></div></header>
    <section id="setup" class="card hidden"><h2>מתחילים 🎮</h2><p>בחרו קוד הורה בן 4–6 ספרות. זה הדבר היחיד שצריך להגדיר.</p><input id="newPin" inputmode="numeric" maxlength="6" placeholder="קוד הורה" /><button id="bootstrapBtn" class="primary">התחל משחק</button></section>
    <section id="game" class="card hidden"><div class="gameTop"><h2 id="prompt">מי כאן?</h2><button id="playAgain" class="ghost hidden">🔊 שוב</button></div><div id="gameStage"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="primary hidden">הבא 🎲</button></section>
    <section id="crew" class="card hidden"><div class="sectionTitle"><h2>👥 החבורה הגדולה</h2><span id="crewProgress" class="pill"></span></div><div id="crewGrid" class="crew"></div></section>
    <section id="parent" class="card hidden"><div class="sectionTitle"><h2>🔐 אזור הורה</h2><button id="closeParent" class="ghost">חזרה למשחק</button></div><p class="muted">הדמויות כאן הן חלק מהמאגר הגלובלי ויופיעו לכל שחקן חדש.</p><div id="progressPanel" class="progressPanel"></div><form id="characterForm"><input type="hidden" id="editCharacterId" /><label>שם<input id="characterName" name="name" required placeholder="למשל: אבי" /></label><label>תמונה ראשונה<input id="image1" name="image1" type="file" accept="image/*" /></label><label>תמונה שנייה<input id="image2" name="image2" type="file" accept="image/*" /></label><label>קול<div class="audioRow"><input name="audio" id="audioFile" type="file" accept="audio/*" /><button type="button" id="recordBtn" class="ghost">🎙️ הקלט</button></div></label><div id="recordStatus" class="muted"></div><div class="formActions"><button type="submit" id="saveCharacterBtn">הוסף לחבורה</button><button type="button" id="cancelEditBtn" class="ghost hidden">בטל עריכה</button></div></form><div class="dangerZone"><button id="resetProgressBtn" class="danger">🔄 אפס התקדמות והתחל מהתחלה</button></div><div id="adminList" class="adminList"></div></section>
  </main>
  <div id="pinModal" class="modal hidden"><div class="modalCard"><h2 id="pinTitle">קוד הורה</h2><p id="pinText" class="muted"></p><input id="parentPinInput" inputmode="numeric" maxlength="6" placeholder="••••" /><div class="formActions"><button id="pinConfirmBtn">אישור</button><button id="pinCancelBtn" class="ghost">ביטול</button></div><div id="pinError" class="errorText"></div></div></div>
<script src="/game-mode-fix.js"></script>
<script src="/app.js" type="module"></script>
<script src="/progress.js"></script>
<script src="/install.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  }
</script>
</body>
</html>
